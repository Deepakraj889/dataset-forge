[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataset-forge"
version = "0.1.1"
description = "Production-grade dataset curation, smart bucketing, and tag engineering for SDXL & Illustrious diffusion training."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Deepak Raj", email = "deepakraj247200@gmail.com" }
]
keywords = [
    "stable-diffusion",
    "sdxl",
    "illustrious",
    "dataset-curation",
    "aspect-ratio-bucketing",
    "danbooru-tags",
    "kohya-ss",
    "lora-training",
    "image-processing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0,<5.0.0",
    "imagehash>=4.3.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "onnxruntime>=1.16.0",
    "pandas>=2.0.0",
    "prompt-toolkit>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
dataset-forge = "dataset_forge.cli:app"

[project.urls]
Homepage = "https://github.com/Deepakraj889/dataset-forge"
Repository = "https://github.com/Deepakraj889/dataset-forge"
Issues = "https://github.com/Deepakraj889/dataset-forge/issues"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

